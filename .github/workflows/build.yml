name: Build xai-grok-pager (i686 32-bit, Debian 12)

# Compile le binaire `xai-grok-pager` pour une machine 32-bit (i686) sous Debian 12
# (HP Pavilion dv1000 : CPU 32-bit, 2 Go de RAM, Debian 12 i386).
#
# Deux variantes sont produites en parallèle :
#   1. `stock`                     -> ARTEFACT PRINCIPAL, à utiliser sur la machine
#   2. `stock,sandbox-enforce`     -> expérimental (sandbox seccomp/Landlock en 32-bit),
#                                     autorisé à échouer sans casser le workflow
#
# Choix structurants :
#   - cible i686-unknown-linux-gnu (un binaire x86_64 ne démarre pas sur ce CPU)
#   - build DANS un conteneur `debian:12` : le binaire est lié à glibc 2.36,
#     exactement la glibc de la machine cible (un build sur ubuntu-latest
#     réclamerait une glibc plus récente -> "GLIBC_2.xx not found")
#   - multilib (gcc-multilib + libc6-dev-i386) côté runner x86_64
#   - protoc 29.3 explicite (le dépôt attend cette version, cf. bin/protoc/DotSlash)
#   - patchs 32-bit déjà appliqués dans le dépôt : fastant 0.1.11, nono (i386),
#     SYS_accept / AUDIT_ARCH_I386 (cf. CI-BUILD.md)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-i686-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_BUILD_TARGET: i686-unknown-linux-gnu
  PROTOC: /opt/protoc/bin/protoc
  RUSTFLAGS: '-C codegen-units=1 -C force-unwind-tables=yes'
  CARGO_NET_RETRY: '5'
  CARGO_HTTP_TIMEOUT: '60'

jobs:
  build-i686:
    name: i686 / ${{ matrix.slug }}
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 180
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: stock
            features: stock
            experimental: false
          - slug: stock-sandbox
            features: stock,sandbox-enforce
            experimental: true

    # Dans un conteneur, le shell par défaut des `run:` est `sh` (dash) :
    # `set -o pipefail` y est illégal -> on force bash.
    defaults:
      run:
        shell: bash

    steps:
      - name: Outils de base (conteneur Debian 12)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils file

      - name: Checkout
        uses: actions/checkout@v4

      - name: Dépendances système (dont multilib 32-bit)
        run: |
          apt-get install -y --no-install-recommends \
            build-essential gcc-multilib libc6-dev-i386 \
            pkg-config libssl-dev protobuf-compiler \
            cmake perl
          echo 'int main(void){return 0;}' > /tmp/t.c
          gcc -m32 /tmp/t.c -o /tmp/t32 && file /tmp/t32

      - name: Installer Rust 1.94.0 + cible i686
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: i686-unknown-linux-gnu

      - name: Installer protoc 29.3
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          rm -rf /opt/protoc && mkdir -p /opt/protoc
          unzip -oq /tmp/protoc.zip -d /opt/protoc
          chmod +x /opt/protoc/bin/protoc
          echo "/opt/protoc/bin" >> "$GITHUB_PATH"
          /opt/protoc/bin/protoc --version
          test -f /opt/protoc/include/google/protobuf/descriptor.proto

      - name: Vérifier les patchs 32-bit du dépôt
        run: |
          set -euo pipefail
          # fastant >= 0.1.11 (0.1.10 importe core::arch::x86_64::__cpuid sous un cfg x86)
          fv=$(grep -A1 'name = "fastant"' Cargo.lock | sed -n 's/.*version = "\(.*\)"/\1/p')
          echo "fastant: $fv"
          [ "$fv" = "0.1.11" ] || cargo update -p fastant --precise 0.1.11
          # nono patché (i386) présent ?
          grep -q 'nono = { path = "third_party/patched/nono" }' Cargo.toml \
            || { echo "::error::patch nono absent de Cargo.toml"; exit 1; }
          grep -q 'target_arch = "x86"' third_party/patched/nono/src/sandbox/linux.rs \
            || { echo "::error::patch i386 de nono absent"; exit 1; }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-i686
          key: i686-debian12-${{ matrix.slug }}
          cache-on-failure: true

      - name: Cache ripgrep i686
        id: cache-rg
        uses: actions/cache@v4
        with:
          path: /tmp/rgroot
          key: rg-i686-15.0.0-${{ matrix.slug }}

      - name: Compiler ripgrep 15.0.0 pour i686
        if: steps.cache-rg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Le build script de xai-grok-tools ne connaît pas d'asset ripgrep pour
          # linux-x86 ("Unsupported target for ripgrep bundling"): on compile le
          # rg 15.0.0 attendu pour i686 et on le passe via l'override officiel.
          cargo install ripgrep --version 15.0.0 --locked \
            --target i686-unknown-linux-gnu --root /tmp/rgroot
          file /tmp/rgroot/bin/rg

      - name: Diagnostic
        run: |
          rustc -vV
          cargo --version
          protoc --version
          echo "target=$CARGO_BUILD_TARGET features=${{ matrix.features }}"
          grep -n -A3 '^\[build\]' .cargo/config.toml || echo 'pas de section [build]'
          df -h /

      - name: cargo build --release (i686)
        env:
          # Les build scripts de xai-grok-tools et xai-grok-shell embarquent rg ;
          # aucun des deux ne connaît d'asset pour linux-x86.
          GROK_TOOLS_BUNDLE_RG_PATH: /tmp/rgroot/bin/rg
          GROK_SHELL_BUNDLE_RG_PATH: /tmp/rgroot/bin/rg
        run: |
          cargo build --release \
            -p xai-grok-pager-bin \
            --target i686-unknown-linux-gnu \
            --no-default-features --features "${{ matrix.features }}"

      - name: Vérifier le binaire (ELF 32-bit)
        run: |
          set -euo pipefail
          BIN=target/i686-unknown-linux-gnu/release/xai-grok-pager
          ls -lh "$BIN"
          file "$BIN"
          file "$BIN" | grep -q 'ELF 32-bit' || { echo "::error::binaire non 32-bit"; exit 1; }
          readelf -h "$BIN" | grep -E 'Class|Machine'
          ldd "$BIN" || true

      - name: Test de démarrage rapide (informatif)
        run: |
          BIN=target/i686-unknown-linux-gnu/release/xai-grok-pager
          "$BIN" --version || echo "::warning::--version a échoué (dépendances i386 manquantes dans le conteneur ?)"

      - name: Préparer l'artefact
        run: |
          set -euo pipefail
          BIN=target/i686-unknown-linux-gnu/release/xai-grok-pager
          mkdir -p dist
          cp "$BIN" "dist/xai-grok-pager"
          strip --strip-unneeded dist/xai-grok-pager || true
          ls -lh dist/xai-grok-pager
          file dist/xai-grok-pager

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-pager-i686-${{ matrix.slug }}
          path: dist/xai-grok-pager
          if-no-files-found: error
          retention-days: 30
