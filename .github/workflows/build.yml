name: Build xai-grok-pager (x86_64)

# Compile le binaire `xai-grok-pager` en CI pour une cible 64-bit.
# Le workspace/app tourne sur la machine hôte (NemApi en local) : ce workflow ne
# sert qu'à produire un binaire fiable, reproductible et téléchargeable.
#
# Pourquoi x86_64 et pas i686 ?
#   - la cible d'origine du dépôt (i686-unknown-linux-gnu, 32-bit) casse sur la
#     dépendance `fastant`, qui utilise core::arch::x86_64 (inexistant en 32-bit) ;
#   - les runners GitHub Actions sont des x86_64 : pas de multilib à installer ;
#   - le build 64-bit est plus rapide et consomme moins de mémoire par unité.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pas de compilation incrémentale en CI (réduit l'usage disque/mémoire, cache plus propre).
  CARGO_INCREMENTAL: '0'
  # Nombre de jobs cargo : 4 = valeur raisonnable sur un runner 4 vCPU.
  # Si le runner OOM (aws-lc-sys, xai-grok-shell), descendre à 2.
  CARGO_BUILD_JOBS: '4'
  # Surcharge la cible forcée par .cargo/config.toml ([build] target = i686-...).
  # L'option CLI --target ci-dessous a de toute façon la priorité.
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
  # Codegen en une seule unité : moins de pics mémoire à l'édition de liens,
  # binaire un peu plus rapide. On répète force-unwind-tables car RUSTFLAGS
  # remplace les rustflags du .cargo/config.toml pour cette cible.
  RUSTFLAGS: '-C codegen-units=1 -C force-unwind-tables=yes'
  # protoc 29.3 imposé (celui du dépôt via bin/protoc/DotSlash, pas celui de l'OS).
  PROTOC: /opt/protoc/bin/protoc

jobs:
  build:
    name: cargo build (release, x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /usr/share/swift /opt/ghc 2>/dev/null || true
          df -h /

      - name: Installer Rust 1.94.0 (+ target x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: x86_64-unknown-linux-gnu

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev protobuf-compiler cmake build-essential perl unzip curl ca-certificates
          protoc --version || true   # celui de l'OS : volontairement écrasé plus bas

      - name: Installer protoc 29.3 (celui du dépôt, pas celui de l'OS)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          sudo rm -rf /opt/protoc
          sudo mkdir -p /opt/protoc
          sudo unzip -oq /tmp/protoc.zip -d /opt/protoc
          sudo chmod +x /opt/protoc/bin/protoc
          echo "/opt/protoc/bin" >> "$GITHUB_PATH"
          /opt/protoc/bin/protoc --version
          ls /opt/protoc/include/google/protobuf/descriptor.proto

      - name: Ajouter de la swap (évite l'OOM sur les gros crates)
        run: |
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Cache cargo (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-x86_64
          workspaces: '. -> target'
          # La cible est dans le nom du dossier de cache : évite de réutiliser un cache i686.
          key: x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Diagnostic cible
        run: |
          rustc -vV
          cargo --version
          protoc --version
          echo "CARGO_BUILD_TARGET=$CARGO_BUILD_TARGET"
          echo '--- cible forcée par le dépôt (si présente) ---'
          grep -n -A3 '^\[build\]' .cargo/config.toml || echo 'aucune section [build] dans .cargo/config.toml'

      - name: cargo build --release
        run: |
          cargo build --release \
            -p xai-grok-pager-bin \
            --target x86_64-unknown-linux-gnu \
            --no-default-features --features stock,sandbox-enforce

      - name: Vérifier le binaire
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-gnu/release/xai-grok-pager
          ls -lh "$BIN"
          file "$BIN"
          ldd "$BIN" | head -20 || true

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-pager
          path: target/x86_64-unknown-linux-gnu/release/xai-grok-pager
          if-no-files-found: error
          retention-days: 30
